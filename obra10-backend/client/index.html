  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; font-size: 20px; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px; word-wrap: break-word;">' + (event.error?.stack || event.message) + '</div>';
        
        // Auto-fix PWA Cache issues on ANY error in localhost
        if (window.location.hostname === 'localhost') {
           navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
              caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
                sessionStorage.setItem('sw_cleared', '1');
                window.location.reload();
              });
           });
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; font-size: 20px; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px; word-wrap: break-word;">' + (event.reason?.stack || event.reason) + '</div>';
      });
      
      // Auto clears once if needed
      if(sessionStorage.getItem('sw_cleared') === '1') {
         sessionStorage.removeItem('sw_cleared');
         console.warn('SW cleared. Retrying load...');
      }
    </script>
    <script>
      // PWA: limpa cache quando BUILD muda OU quando HTML está atrás do servidor
      (function () {
        var BUILD = '2.9.6-20260817';

        function clearPwa() {
          var clear = window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();
          return clear.then(function () {
            if (!('serviceWorker' in navigator)) return;
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            });
          });
        }

        function hardReload(buildMark) {
          try {
            if (buildMark) localStorage.setItem('obra10_build', buildMark);
          } catch (e) {}
          var url = new URL(window.location.href);
          url.searchParams.set('_v', String(Date.now()));
          window.location.replace(url.toString());
        }

        // 1) Migração one-shot quando este HTML traz BUILD novo
        var stored = null;
        try { stored = localStorage.getItem('obra10_build'); } catch (e) {}
        if (stored !== BUILD) {
          try { localStorage.setItem('obra10_build', BUILD); } catch (e) {}
          clearPwa().then(function () { hardReload(BUILD); }).catch(function () { hardReload(BUILD); });
          return;
        }

        // 2) HTML atrás do servidor: NÃO recarrega sozinho (sumia o botão Atualizar).
        // Só marca pendência para o React mostrar o CTA até o usuário tocar.
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.buildId) return;
            if (data.buildId === BUILD) return;
            try {
              sessionStorage.setItem('obra10_update_pending', '1');
              sessionStorage.setItem('obra10_pending_build', data.buildId);
            } catch (e) {}
          })
          .catch(function () {});

        if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js?v=2.9.6').then(function (reg) {
              reg.update();
            }).catch(function () {});
          });
        }
      })();
    </script>
  </body>
